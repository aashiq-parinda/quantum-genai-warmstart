[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwarmstart"
version = "0.1.0"
description = "Original Research: Transformer-Accelerated VQE via Parameter Warm-Starting (GenAI x Quantum)"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "jupyter>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
